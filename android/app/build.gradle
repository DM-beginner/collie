plugins { id 'com.android.application' }

android {
    namespace 'dev.dmbeginner.colliepocket'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.dmbeginner.colliepocket'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
